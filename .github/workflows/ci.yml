name: CTCI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://jkprxdjrpnfbfxzryhtq.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_c4JpbBoCgtcJ8q3rqiuc7Q_heLb1GRw
      NEXT_PUBLIC_APP_URL: https://chromachat.syntax-xxx.is-a.dev
      SUPABASE_SECRET_KEY: ci-placeholder-secret
      TWITCH_CLIENT_ID: ci-placeholder
      TWITCH_CLIENT_SECRET: ci-placeholder
      TWITCH_EVENTSUB_SECRET: ci-placeholder-secret
      DISCORD_CLIENT_ID: ci-placeholder
      DISCORD_CLIENT_SECRET: ci-placeholder
      DISCORD_BOT_TOKEN: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
